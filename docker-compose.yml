version: "3.8"

services:
  bolletta-sync:
    build: .
    container_name: bolletta-sync
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./google_credentials.json:/app/google_credentials.json
      - ./google_token.json:/app/google_token.json

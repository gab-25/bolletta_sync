<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolletta Sync - Login</title>
    <link rel="icon" href="/static/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (localStorage.getItem("basic_auth")) {
        window.location.href = "/";
      }
    </script>
  </head>
  <body class="bg-gray-100 min-h-screen font-sans flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-sm">
      <div class="flex items-center justify-center mb-6 space-x-3">
        <img
          src="/static/logo.png"
          alt="Logo"
          class="h-10 w-10 rounded-lg shadow-md bg-white border border-blue-400"
        />
        <h1 class="text-2xl font-bold text-gray-800">Bolletta Sync</h1>
      </div>

      {% if error %}
      <div class="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm">
        Invalid credentials. Please try again.
      </div>
      {% endif %}

      <form id="login-form" class="space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input
            type="text"
            id="username"
            autocomplete="username"
            required
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            required
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 px-4 rounded font-semibold hover:bg-blue-700 transition-colors"
        >
          Sign in
        </button>
      </form>
    </div>

    <script>
      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        localStorage.setItem("basic_auth", btoa(username + ":" + password));
        window.location.href = "/";
      });
    </script>
  </body>
</html>

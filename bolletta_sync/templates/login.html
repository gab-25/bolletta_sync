<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bolletta Sync - Login</title>
    <link rel="icon" href="/static/logo.png" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-body">
    <div class="login-card">
      <div class="login-header">
        <img src="/static/logo.png" alt="Logo" class="navbar__logo" />
        <h1>Bolletta Sync</h1>
      </div>

      {% if error %}
      <div class="login-error">Invalid credentials. Please try again.</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="login-field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
          />
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="button button--block">Sign in</button>
      </form>
    </div>
  </body>
</html>
